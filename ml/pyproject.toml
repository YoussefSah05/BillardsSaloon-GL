[project]
name = "billiards-ml"
version = "0.1.0"
description = "Self-play learning for Septhuit: data generation, training, ONNX export"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "torch>=2.4",
    "onnx>=1.16",
    "onnxruntime>=1.19",
    "tqdm>=4.66",
    "gymnasium>=1.0",
    "stable-baselines3>=2.4",
    "pyyaml>=6.0",
    "tensorboard>=2.17",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
